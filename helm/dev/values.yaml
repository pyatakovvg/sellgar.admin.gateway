replicas: 1
ingress:
  host: dev.sellgar.io
configmaps:
- nameOverride: admin-gateway-env
  enabled: true
  filename: .env
  data: |
    PORT=8080
    BASE_URL=http://dev.sellgar.io/api/admin
    ORIGINS=http://dev.sellgar.io
    API_FILE_SRV=http://file-service:8080
    API_MEDIA_SRV=http://media-service:8080
    AUTH_COOKIE=admin.sid
    AUTH_COOKIE_SECURE=false
    AUTH_COOKIE_SAME_SITE=lax
    AUTH_COOKIE_PATH=/
    SOCKET_TICKET_AUDIENCE=realtime
    SOCKET_TICKET_TTL_SECONDS=60
    AMQP_PORT=5672
    AMQP_HOSTNAME=rabbitmq
    AMQP_PRODUCT_SRV_COMMAND_QUEUE=product.v2.commands
    AMQP_SHOP_SRV_COMMAND_QUEUE=shop_srv.command.queue
    AMQP_STORE_SRV_COMMAND_QUEUE=store_srv.command.queue
    AMQP_CART_SRV_COMMAND_QUEUE=cart_srv.command.queue
    AMQP_IDENTITY_SRV_COMMAND_QUEUE=identity_srv_command_queue
    AMQP_FILE_SRV_COMMAND_QUEUE=file_srv.service.queue
    AMQP_MEDIA_SRV_COMMAND_QUEUE=media_srv.command.queue
    AMQP_ADMIN_GATEWAY_REALTIME_EVENT_QUEUE=admin_gateway.realtime.event.queue
    AMQP_ADMIN_GATEWAY_IDENTITY_SRV_EVENT_QUEUE=admin_gateway_identity_srv_event_queue
    AMQP_EVENTS_EXCHANGE=event.exchange
    AMQP_IDENTITY_SRV_EXCHANGE=identity_srv_exchange
