name: Release to production
run-name: Deploy ${{ inputs.release_tag }} to production

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Verified candidate tag from Releases
        required: true
        type: string

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: admin-gateway-production
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/master'
    uses: sellgar/sellgar.infrastructure/.github/workflows/validate-release.yml@delivery-v0.6.0
    with:
      release_tag: ${{ inputs.release_tag }}
      migrations: false

  delivery:
    needs: validate
    uses: sellgar/sellgar.infrastructure/.github/workflows/deliver-application.yml@delivery-v0.6.0
    secrets:
      SUBMODULES_READ_TOKEN: ${{ secrets.SUBMODULES_READ_TOKEN }}
    with:
      environment: prod
      namespace: sellgar-prod
      release-name: admin-gateway
      source-revision: ${{ needs.validate.outputs.source }}
      chart-revision: ${{ needs.validate.outputs.chart }}
      image-digest: ${{ needs.validate.outputs.image }}

  back-merge:
    needs: delivery
    uses: sellgar/sellgar.infrastructure/.github/workflows/back-merge.yml@delivery-v0.6.0
    permissions:
      contents: read
      pull-requests: write
